name: ci

on:
  push:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked pyright
      - run: uv run --locked pytest

  build:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    environment: staging
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker run -d -p 8000:8000 -e APP_ENV -e PROVIDER_API_KEY "$IMAGE@$DIGEST"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8000/healthz
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          APP_ENV: ${{ vars.APP_ENV }}
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
      - run: docker buildx imagetools create --tag "$IMAGE:staging" "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}

  deploy-production:
    needs: [build, deploy-staging]
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker run -d -p 8000:8000 -e APP_ENV -e PROVIDER_API_KEY "$IMAGE@$DIGEST"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:8000/healthz
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          APP_ENV: ${{ vars.APP_ENV }}
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
      - run: docker buildx imagetools create --tag "$IMAGE:production" "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
